# electron-builder 配置 —— 把「单进程桌宠」打成双击可运行的 Windows 应用。
#
# 关键取舍：
#   1. 不带 node_modules：`lib/app.js` 已把 zod 打进来，其余外部只有 `electron` 与两个
#      永不执行的动态 import（@electron/get、@electron-internal/extract-zip，见 tsdown.config.mjs）。
#   2. electronDist 指向本机已解压的 Electron（默认 ~/.dsh/electron），由 scripts/dist.mjs 注入，
#      避免每次打包都从 GitHub 重新下一套 110 MB —— 这台机器 github.com 不通。
#   3. asar 打开：素材（webm 51 MB）留在包内由主进程 fs 读取；没有原生模块需要 unpack。
appId: com.dshpet.desktop
productName: DSH Pet
copyright: dsh-pet contributors

directories:
  output: dist-app

# 应用主进程入口不是插件入口（package.json 的 main 必须留给 DSH 插件加载），所以在打包元数据里覆盖
extraMetadata:
  main: lib/app.js

files:
  - lib/**
  - runtime/**
  # 素材只带运行时要用的四类：动画（webm）、字体、表情包、头像；
  # `assets/preview` 是 README 的 GIF（64 MB），插件自己的 files 白名单也不发它，这里同样排除。
  - assets/webm/**
  - assets/fonts/**
  - assets/pic/**
  - assets/memes/**
  - assets/config.jsonc
  - assets/logo.png
  - package.json
  - LICENSE
  - '!node_modules/**'

asar: true
npmRebuild: false

# 与 package.json 的 @electron/get 默认下载版本保持一致；改版本时两处一起改
electronVersion: 43.3.0
# electronDist 由 scripts/dist.mjs 经 `--config.electronDist=<本机解压目录>` 传入：
# 这个字段不做 ${env.*} 宏展开（实测会原样当成路径），所以不能写死在 YAML 里。

# 默认绿色版；`npm run dist:installer` 生成带安装向导、快捷方式及卸载入口的 NSIS 安装包。
win:
  icon: assets/logo.png
  signExecutable: false
  target:
    - dir

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Pet
  artifactName: DSH-Pet-Setup-${version}-${arch}.${ext}

mac:
  category: public.app-category.entertainment
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: DSH-Pet-${version}-macOS-${arch}.${ext}

linux:
  category: Game
  icon: assets/logo.png
  executableName: dsh-pet
  synopsis: A local desktop companion
  target:
    - AppImage
    - deb
  artifactName: DSH-Pet-${version}-Linux-${arch}.${ext}
  desktop:
    entry:
      StartupWMClass: dsh-pet
      Keywords: pet;companion;

deb:
  maintainer: dsh-pet contributors <noreply@github.com>
