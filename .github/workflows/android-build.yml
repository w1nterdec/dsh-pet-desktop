name: Android checks and preview APK

on:
  workflow_dispatch:
  pull_request:
    paths: ["android/**", ".github/workflows/android-build.yml"]
  push:
    branches: [main, desktop-app]
    paths: ["android/**", ".github/workflows/android-build.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Pet-Android-preview
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
