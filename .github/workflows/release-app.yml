name: Publish desktop installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dsh-pet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run dist:installer
        env:
          DSH_PET_ALLOW_ELECTRON_DOWNLOAD: '1'
      - run: pnpm run test:app
        env:
          DSH_PET_APP_EXECUTABLE: ${{ github.workspace }}\dsh-pet\dist-app\win-unpacked\DSH Pet.exe
      - name: Upload installer to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: gh release upload $env:RELEASE_TAG dist-app/DSH-Pet-Setup-*.exe --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Pet-Installer
          path: dsh-pet/dist-app/DSH-Pet-Setup-*.exe
          if-no-files-found: error
